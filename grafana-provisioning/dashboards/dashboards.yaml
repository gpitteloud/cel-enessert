apiVersion: 1

providers:
  - name: 'CEL Dashboards'
    orgId: 1
    # The reference dashboards, from git. Locked: users "Save as" a copy into
    # the unprovisioned "CEL Workspace" folder and experiment there.
    folder: 'CEL Reference'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
