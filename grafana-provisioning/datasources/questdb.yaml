apiVersion: 1

# The only datasource: QuestDB is the system of record. See QUESTDB.md, which
# also lists the plugin's silent-failure constraints.
#
# uid is pinned to "QuestDB" because the dashboard JSONs reference it by uid.
# Grafana would otherwise assign a random one and every panel would load with
# "datasource not found".
datasources:
  - name: QuestDB
    type: questdb-questdb-datasource
    uid: QuestDB
    access: proxy
    # PG-wire, not the 9000 REST/console port. Default OSS credentials are
    # admin/quest and cannot be changed in OSS without server.conf; neither port
    # is published outside cel-network (see docker-compose.yml).
    url: questdb:8812
    user: admin
    isDefault: false
    editable: false
    jsonData:
      server: questdb
      port: 8812
      username: admin
      # QuestDB OSS PG-wire does not offer TLS; the traffic never leaves the
      # docker network.
      tlsMode: disable
      # QuestDB has a single database, `qdb`.
      database: qdb
    secureJsonData:
      password: quest
