# No `version:` key. It was only ever read by the legacy docker-compose v1
# (Python) binary; Compose v2 ignores it and warns that it is obsolete. Keeping
# it would also be actively misleading here: this file uses
# `condition: service_completed_successfully`, which the 3.8 schema it claimed to
# conform to did not support.
#
# The project name is pinned rather than inherited.
# The scheduler's --docker-filter below matches on exactly this string
name: cel-devl

services:
  # The system of record. See QUESTDB.md.
  questdb-devl:
      # Pin the version so a silent `latest` bump can't change dedup or decimal
      # behaviour under us. Both are load-bearing here.
    image: questdb/questdb:9.4.3
    container_name: cel-questdb-devl
    restart: unless-stopped
    # DELIBERATELY no `ports:` -- QuestDB OSS serves the web console and the
    # REST API on 9000 with no meaningful auth, so publishing it would expose
    # unauthenticated writes to anyone who can reach the NAS. Everything that
    # needs it (parser, Grafana) is on cel-network-devl. To inspect the console:
    #   ssh -L 9000:cel-questdb-devl:9000 <nas>     (or `docker exec` + curl)
    volumes:
      - /volume1/docker/cel-devl/questdb-data:/var/lib/questdb
    environment:
      - QDB_TELEMETRY_ENABLED=false
      - QDB_PG_USER=${DB_USER}
      - QDB_PG_PASSWORD=${DB_PASSWORD}
      # used by Grafana
      - QDB_PG_READONLY_USER_ENABLED=true
      - QDB_PG_READONLY_USER=${RO_DB_USER}
      - QDB_PG_READONLY_PASSWORD=${RO_DB_PASSWORD}
      # access to the web console
      - QDB_HTTP_USER=${HTTP_USER}
      - QDB_HTTP_PASSWORD=${HTTP_PASSWORD}
      - QDB_HTTP_SECURITY_READONLY=false # full access through the web console on devl
    networks:
      - cel-network-devl

  # One-shot schema init. Runs to completion and exits; `restart: "no"` plus the
  # parser's `service_completed_successfully` dependency means the parser cannot
  # start against an unverified schema.
  #
  # This is a separate container rather than something baked into the questdb
  # image on purpose. QuestDB has no docker-entrypoint-initdb.d hook (that is a
  # Postgres convention) and no Python in the image, so a custom image would need
  # a wrapper entrypoint that backgrounds the server to run the DDL -- and that
  # would defeat the point of questdb_init.py, which exits non-zero on a wrong
  # schema. A wrapper that failed would leave the database up and writable, which
  # is worse than not starting at all.
  #
  # TIMING: `service_completed_successfully` makes the whole deploy BLOCK on this
  # container, and it pip-installs before it runs. Budget ~1-2 min on a cold
  # start. That exceeds Cloudflare Tunnel's ~100s origin timeout, so deploy this
  # stack over SSH or the LAN IP, never through the tunnel -- a 502 there is the
  # gateway giving up on a deploy that is still running, not a rejected file.
  questdb-init-devl:
    image: python:3.11-slim
    container_name: cel-questdb-init-devl
    restart: "no"
    volumes:
      - /volume1/docker/cel-devl/scripts:/app/scripts:ro
    working_dir: /app
    command: >
      sh -c "
        pip install --no-cache-dir 'psycopg[binary]' &&
        python scripts/questdb_init.py --wait 60
      "
    environment:
      - QUESTDB_DSN=postgresql://${DB_USER}:${DB_PASSWORD}@questdb-devl:8812/qdb
    depends_on:
      - questdb-devl
    networks:
      - cel-network-devl

  grafana-devl:
    image: grafana/grafana:latest
    container_name: cel-grafana-devl
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - /volume1/docker/cel-devl/grafana-data:/var/lib/grafana
      - /volume1/docker/cel-devl/grafana-provisioning:/etc/grafana/provisioning
      - /volume1/docker/cel-devl/grafana-dashboards:/var/lib/grafana/dashboards
    environment:
      # No GF_SECURITY_ADMIN_USER / _PASSWORD on purpose. Grafana only applies
      # them when it initialises an empty grafana-data volume, so they cannot
      # change the live password -- they would just hardcode a stale credential
      # here and silently reset the admin back to it if the volume is ever
      # recreated. Manage the password in Grafana's UI instead.
      # QuestDB datasource plugin (pre-1.0; its constraints are documented in
      # QUESTDB.md). If it proves unusable, the fallback is Grafana's built-in
      # Postgres datasource against questdb:8812 -- remove this line in that case.
      - GF_INSTALL_PLUGINS=questdb-questdb-datasource
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/cel_energy_overview.json
      - GF_SERVER_ROOT_URL=https://grafana.oche22.ch
      - GF_SERVER_DOMAIN=grafana.oche22.ch
      - GF_LOG_LEVEL=warn
      - QDB_USER=${DB_USER}
      - QDB_PASSWORD=${DB_PASSWORD}
    depends_on:
      # Ordering only, not readiness -- Grafana retries a datasource that is
      # not up yet.
      - questdb-devl
    networks:
      - cel-network-devl

  cel-parser-job-devl:
    build: .
    container_name: cel-parser-job-devl
    # Keeping it alive makes an ad-hoc run possible:
    #   docker exec cel-parser-job-devl python -m scripts.sftp_download_and_process
    restart: unless-stopped
    command: ["sleep", "infinity"] # real command in ofelia command label
    volumes:
      - /volume1/docker/cel-devl/input:/data/incoming
      - /volume1/docker/cel-devl/scripts:/app/scripts
      - /volume1/docker/cel-devl/config:/app/config
      - /volume1/docker/cel-devl/logs:/app/logs
      - /volume1/docker/cel-devl/archive:/data/archive
    environment:
      # PG-wire endpoint. Default OSS credentials are admin/quest and cannot be
      # changed in OSS without server.conf; the port is unpublished (see the
      # questdb service) so it is reachable only from cel-network-devl.
      - QUESTDB_DSN=postgresql://${DB_USER}:${DB_PASSWORD}@questdb-devl:8812/qdb
      - SFTP_HOST=1o9p0.ftp.infomaniak.com
      - SFTP_PORT=21
    networks:
      - cel-network-devl
    secrets:
      - sftp_user
      - sftp_password
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.parserjob-devl.schedule: "0 0 10 * * *"
      ofelia.job-exec.parserjob-devl.command: "python -m scripts.sftp_download_and_process"

  scheduler:
    image: mcuadros/ofelia:0.3.22
    container_name: cel-scheduler-devl
    depends_on:
      questdb-init-devl:
        condition: service_completed_successfully
    # --docker-filter scopes label discovery to THIS stack.
    command: daemon --docker --docker-filter label=com.docker.compose.project=cel-devl
    environment:
      - TZ=Europe/Zurich
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - cel-network-devl

networks:
  cel-network-devl:
    # EXTERNAL and explicitly named, so this stack does not own it. The tunnel
    # stack (docker-compose.cloudflared.yml) attaches to the same network, and a
    # shared resource must outlive both stacks: if this stack created it, tearing
    # this stack down would try to delete the network out from under cloudflared.
    #
    # `name:` pins the real Docker name. Without it, Compose would prefix the
    # project name (stack `cel` -> `cel_cel-network`), so the two stacks would
    # have to guess at a name that changes if the stack is ever renamed.
    #
    # Create it ONCE before deploying either stack (Portainer -> Networks -> Add
    # network, name `cel-network-devl`, driver bridge), or:
    #   docker network create cel-network-devl
    # If it is missing, both stacks fail loudly with "network not found".
    external: true
    name: cel-network-devl

secrets:
  sftp_user:
    file: ./secrets/sftp_user.txt
  sftp_password:
    file: ./secrets/sftp_password.txt
