# Configuration for CEL Community

# QuestDB - the system of record. See QUESTDB.md.
# Writes are never optional: a failed write marks the file FAILED so it stays in
# the incoming folder and is retried, rather than being archived having stored
# nothing.
questdb:
  # Defaults to $QUESTDB_DSN, set in docker-compose.yml.
  dsn: ""

# Project configuration
project:
  name: "cel"
  community_name: "Coopérative Enessert"

# Data processing
processing:
  incoming_path: "/data/incoming"
  # The provider's declared metering points. Required: the job refuses to start
  # without it rather than ingesting breakdowns it cannot attribute.
  meters_file: "/app/config/meters.yaml"
  archive_path: "/data/archive"
  # How far back the download looks for files we do not have yet. Deliveries
  # arrive in waves up to hours late, so the window has to exceed a single day.
  # Raising it widens the archive scan by the same number of zips.
  download_window_days: 7

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/parser.log"
  max_size_mb: 10
  backup_count: 5
